[project]
name = "automata-api"
version = "0.1.0"
description = "FastAPI backend for the Automata desktop agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.136.1",
  "httpx[socks]==0.28.1",
  "jsonschema>=4.23,<5",
  "mcp<2",
  "tzdata; sys_platform == 'win32'",
  "uvicorn==0.46.0",
  "websockets==16.0",
]

[project.optional-dependencies]
build = [
  "pyinstaller>=6.11",
]

[dependency-groups]
dev = [
  "pyright>=1.1.411,<2",
  "pytest>=8.3",
  "ruff>=0.16,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"automata_api/**/__init__.py" = ["F401"]

[tool.uv]
package = false
